[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "catalogflow"
version = "0.9.0"
description = "A safe, human-approved product catalog pipeline for WooCommerce."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CatalogFlow contributors" }]
dependencies = [
  "keyring>=25,<27",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
catalogflow = "catalogflow.cli:main"

[project.gui-scripts]
catalogflow-desktop = "catalogflow.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/catalogflow"]

[tool.hatch.build.targets.wheel.force-include]
"src/catalogflow/dashboard.html" = "catalogflow/dashboard.html"
"src/catalogflow/dashboard-i18n.js" = "catalogflow/dashboard-i18n.js"
"src/catalogflow/dashboard-fx.js" = "catalogflow/dashboard-fx.js"
"src/catalogflow/dashboard-history.js" = "catalogflow/dashboard-history.js"
"src/catalogflow/dashboard-import.js" = "catalogflow/dashboard-import.js"
"src/catalogflow/browser/catalogflow-collector.user.js" = "catalogflow/browser/catalogflow-collector.user.js"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
